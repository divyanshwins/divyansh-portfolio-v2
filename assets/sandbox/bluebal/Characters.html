    const onFile = ev => {
      const f = ev.target.files[0];
      if (!f) return;
      onUpload({ type: "upload", name: f.name, preview: URL.createObjectURL(f) });
    };
    if (compact) {
      return e("div", { className: "vsource-empty" },
        e("button", { className: "vsbtn", onClick: browse },
          e("div", { className: "vsi" }, e(Icon, { name: "image", size: 14 })),
          "Upload design"
        ),
        e("button", { className: "vsbtn ai", onClick: onAI },
          e("div", { className: "vsi" }, e(Icon, { name: "sparkles", size: 14 })),
          "Design with AI"
        ),
        e("input", { type: "file", ref: fileRef, className: "hidden-file", accept: "image/*", onChange: onFile })
      );
    }
    return e("div", { className: "actions" },
      e("div", { className: "ucta", onClick: browse },
        e("div", { className: "ui" }, e(Icon, { name: "image", size: 18 })),
        e("div", { className: "ut" }, "Upload character design"),
        e("div", { className: "uh" }, "PNG, JPG or SVG \u2014 drag in or browse"),
        e("input", { type: "file", ref: fileRef, className: "hidden-file", accept: "image/*", onChange: onFile })
      ),
      e("div", { className: "orline" }, e("span"), "or", e("span")),
      e(Button, { variant: "outline", style: { width: "100%" }, onClick: onAI },
        e(Icon, { name: "sparkles", size: 15 }), "Design with AI"
      )
    );
  }

  function SourceDone({ source, color, onReplace, onClear }) {
    const ai = source.type === "ai";
    return e("div", { className: "done-row" + (ai ? " ai" : "") },
      e("div", { className: "di", style: { background: ai ? "#7c3aed" : "#16a34a" } },
        ai ? e(Icon, { name: "sparkles", size: 15 }) : e(Icon, { name: "check", size: 16 })
      ),
      e("div", { className: "dgrow" },
        e("div", { className: "dt" }, ai ? "AI-designed" : source.name),
        e("div", { className: "ds" }, ai ? "Generated from the manuscript" : "Uploaded design file")
      ),
      e("button", { className: "linkbtn", onClick: onReplace }, "Replace")
    );
  }

  // ---- per-variant page range editor ----
  function RangeEditor({ ranges, onChange }) {
    const [adding, setAdding] = useState(false);
    const [from, setFrom] = useState("");
    const [to, setTo] = useState("");
    const fromRef = useRef(null);

    const start = () => { setAdding(true); setFrom(""); setTo(""); setTimeout(() => fromRef.current && fromRef.current.focus(), 0); };
    const a = parseInt(from, 10), b = parseInt(to || from, 10);
    const valid = from !== "" && a >= 1 && a <= TOTAL && b >= a && b <= TOTAL;
    const commit = () => {
      if (!valid) return;
      onChange([...ranges, [a, b]].sort((x, y) => x[0] - y[0]));
      setAdding(false); setFrom(""); setTo("");
    };
    const remove = i => onChange(ranges.filter((_, j) => j !== i));

    return e("div", null,
      e("div", { className: "ranges-label" }, e(Icon, { name: "book-open", size: 13 }), "Pages this variant appears on"),
      e("div", { className: "rchips" },
        ranges.map((r, i) => e("span", { className: "rchip", key: i },
          fmtRange(r),
          e("span", { className: "rm", title: "Remove", onClick: () => remove(i) }, e(Icon, { name: "x", size: 12 }))
        )),
        adding
          ? e("span", { className: "raddform" },
              e("input", { ref: fromRef, type: "number", min: 1, max: TOTAL, placeholder: "from", value: from,
                onChange: ev => setFrom(ev.target.value),
                onKeyDown: ev => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") setAdding(false); } }),
              e("span", { className: "dash" }, "\u2013"),
              e("input", { type: "number", min: 1, max: TOTAL, placeholder: "to", value: to,
                onChange: ev => setTo(ev.target.value),
                onKeyDown: ev => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") setAdding(false); } }),
              e("button", { className: "ok", disabled: !valid, onClick: commit, title: "Add range" }, e(Icon, { name: "check", size: 15 }))
            )
          : e("button", { className: "raddbtn", onClick: start }, e(Icon, { name: "plus", size: 13 }), "Add page range")
      )
    );
  }

  // ---- full variant editor for a character ----
  function VariantEditor({ c, variants, onVariants, onAI }) {
    const setVariant = (i, patch) => onVariants(variants.map((v, j) => j === i ? { ...v, ...patch } : v));
    const setCount = (n) => {
      n = Math.max(2, Math.min(6, n));
      if (n === variants.length) return;
      if (n > variants.length) {
        const add = [];
        for (let i = variants.length; i < n; i++) add.push(newVariant(i));
        onVariants([...variants, ...add]);
      } else {
        onVariants(variants.slice(0, n));
      }
    };

    const { owner, uncovered, overlaps } = analyze(variants);

    return e("div", null,
      e("div", { className: "vcount" },
        e("div", null,
          e("div", { className: "vl" }, "How many variants of " + c.name + "?"),
          e("div", { className: "vh" }, "e.g. a base look and an evolved form later in the story")
        ),
        e("div", { className: "stepper" },
          e("button", { onClick: () => setCount(variants.length - 1), disabled: variants.length <= 2, "aria-label": "Fewer" }, e(Icon, { name: "minus", size: 15 })),
          e("div", { className: "val" }, variants.length),
          e("button", { onClick: () => setCount(variants.length + 1), disabled: variants.length >= 6, "aria-label": "More" }, e(Icon, { name: "plus", size: 15 }))
        )
      ),

      variants.map((v, i) => e("div", { className: "variant", key: v.id },
        e("div", { className: "vhead" },
          e("span", { className: "vchip", style: { background: VAR_COLORS[i % VAR_COLORS.length] } }),
          e("input", {
            className: "vname-input", value: v.name,
            onChange: ev => setVariant(i, { name: ev.target.value }),
            "aria-label": "Variant name"
          })
        ),
        e("div", { className: "vbody" },
          // source column
          v.source
            ? e("div", { className: "vsource-set" },
                e("div", { className: "vthumb", style: { background: v.source.preview ? "#000" : VAR_COLORS[i % VAR_COLORS.length] } },
                  v.source.preview
                    ? e("img", { src: v.source.preview, alt: v.name })
                    : e(Icon, { name: v.source.type === "ai" ? "sparkles" : "image", size: 26 }),
                  e("span", { className: "badge" },
                    e(Icon, { name: v.source.type === "ai" ? "sparkles" : "image", size: 11 }),
                    v.source.type === "ai" ? "AI design" : "Uploaded")
                ),
                e("div", { className: "vfoot" },
                  v.source.type === "ai"
                    ? e("button", { className: "linkbtn", onClick: () => onAI(v.id) }, e(Icon, { name: "pencil", size: 12 }), "Edit in AI")
                    : null,
                  e("button", { className: "linkbtn", onClick: () => setVariant(i, { source: null }) }, e(Icon, { name: "x", size: 12 }), "Remove")
                )
              )
            : e(SourcePicker, {
                compact: true,
                onUpload: (d) => setVariant(i, { source: d }),
                onAI: () => onAI(v.id)
              }),
          // ranges column
          e(RangeEditor, { ranges: v.ranges, onChange: (rs) => setVariant(i, { ranges: rs }) })
        )
      )),

      // coverage timeline
      e("div", { className: "coverage" },
        e("div", { className: "cov-track", style: { "--pages": TOTAL } },
          variants.map((v, vi) => (v.ranges || []).map((r, ri) =>
            e("div", { key: vi + "-" + ri, className: "cov-seg", style: {
              left: ((r[0] - 1) / TOTAL * 100) + "%",
              width: ((Math.min(r[1], TOTAL) - r[0] + 1) / TOTAL * 100) + "%",
              background: VAR_COLORS[vi % VAR_COLORS.length]
            } })
          ))
        ),
        e("div", { className: "cov-foot" },
          uncovered.length === 0 && overlaps === 0
            ? e("span", { className: "ok", style: { display: "inline-flex", alignItems: "center", gap: 5 } },
                e(Icon, { name: "circle-check", size: 14 }), "All " + TOTAL + " pages mapped")
            : e("span", { className: "warn", style: { display: "inline-flex", alignItems: "center", gap: 5 } },
                e(Icon, { name: "circle-alert", size: 14 }),
                uncovered.length
                  ? ("Pages " + compress(uncovered) + " not assigned yet")
                  : (overlaps + " page" + (overlaps > 1 ? "s" : "") + " assigned to two variants")
              ),
          e("div", { className: "legend" },
            variants.map((v, vi) => e("span", { className: "leg", key: vi },
              e("span", { className: "sw", style: { background: VAR_COLORS[vi % VAR_COLORS.length] } }),
              v.name
            ))
          )
        )
      )
    );
  }

  // ===================================================================
  function CharacterCard({ c, state, onChange, onAI }) {
    const { mode, design, variants } = state;
    const ready = isReady(state);

    const setMode = (m) => {
      if (m === "variants") {
        onChange({ mode: "variants", design: null, variants: variants.length ? variants : [newVariant(0), newVariant(1)] });
      } else {
        onChange({ mode: "constant", design: design, variants: [] });
      }
    };
    const reset = () => onChange({ mode: null, design: null, variants: [] });

    const wide = mode === "variants";

    // status pill
    let pill;
    if (ready) pill = e("span", { className: "pill done" }, e(Icon, { name: "check", size: 12 }), "Ready");
    else if (mode === "variants") pill = e("span", { className: "pill variant" }, e(Icon, { name: "layers", size: 12 }), variants.length + " variants");
    else pill = e("span", { className: "pill todo" }, "Needs design");

    return e("div", { className: "ccard" + (wide ? " wide" : "") + (ready ? " ready" : "") },
      e("div", { className: "ctop" },
        e("div", { className: "cava", style: { background: design && design.preview ? "transparent" : c.color } },
          design && design.preview ? e("img", { src: design.preview, alt: c.name })
            : (design && design.type === "ai" ? e(Icon, { name: "sparkles", size: 20 }) : c.name[0])
        ),
        e("div", { style: { minWidth: 0 } },
          e("div", { className: "cname" }, c.name),
          e("div", { className: "cdesc" }, c.desc)
        ),
        e("div", { className: "cstate" },
          mode && !ready ? e("button", { className: "linkbtn", onClick: reset }, "Change") : null,
          pill
        )
      ),

      e("div", { className: "body" },
        // ---- undecided: type chooser ----
        !mode && e("div", null,
          e("p", { className: "chooser-q" }, "Does " + c.name + " look the same through the whole book?"),
          e("div", { className: "types" },
            e("button", { className: "typetile", onClick: () => setMode("constant") },
              e("div", { className: "ti" }, e(Icon, { name: "user", size: 16 })),
              e("div", { className: "tt" }, "One consistent look"),
              e("div", { className: "ts" }, "Same design on every page. One reference is enough.")
            ),
            e("button", { className: "typetile", onClick: () => setMode("variants") },
              e("div", { className: "ti" }, e(Icon, { name: "layers", size: 16 })),
              e("div", { className: "tt" }, "Has variants"),
              e("div", { className: "ts" }, "Look changes across the story \u2014 map each to its pages.")
            )
          )
        ),

        // ---- constant ----
        mode === "constant" && (design
          ? e(SourceDone, { source: design, onReplace: () => onChange({ ...state, design: null }) })
          : e(SourcePicker, {
              onUpload: (d) => onChange({ ...state, design: d }),
              onAI: () => onAI(null)
            })
        ),

        // ---- variants ----
        mode === "variants" && e(VariantEditor, {
          c, variants,
          onVariants: (vs) => onChange({ ...state, variants: vs }),
          onAI: (vid) => onAI(vid)
        })
      )
    );
  }

  // a character is ready when its chosen path is fully specified
  function isReady(state) {
    if (state.mode === "constant") return !!state.design;
    if (state.mode === "variants") {
      if (!state.variants.length) return false;
      return state.variants.every(v => v.source && v.ranges && v.ranges.length > 0);
    }
    return false;
  }

  // ===================================================================
  function App() {
    const [chars, setChars] = useState(loadChars);

    // persist on every change so the AI page round-trip keeps state
    useEffect(() => { saveChars(chars); }, [chars]);

    const setChar = (id, next) => setChars(s => ({ ...s, [id]: next }));

    const goAI = (charId, variantId) => {
      saveChars(chars); // ensure latest is on disk before navigating
      const params = new URLSearchParams({ char: charId });
      if (variantId) params.set("variant", variantId);
      location.href = "Design with AI.html?" + params.toString();
    };

    const total = CHARACTERS.length;
    const done = CHARACTERS.filter(c => isReady(chars[c.id])).length;
    const allDone = done === total;

    return e("div", { className: "shell" },
      e("div", { className: "head" },
        e("button", { className: "backbtn", "aria-label": "Back", onClick: () => location.href = "New Project.html" },
          e(Icon, { name: "arrow-right", size: 18, style: { transform: "rotate(180deg)" } })
        ),
        e("h1", null, "Characters")
      ),

      e("div", { className: "ai-banner" },
        e("div", { className: "spark" }, e(Icon, { name: "sparkles", size: 17 })),
        e("div", null,
          e("div", { className: "t" }, "We scanned your manuscript and found 4 characters"),
          e("div", { className: "s" }, "First, tell us whether each one keeps a single look or changes through the story \u2014 then upload a reference or design it with AI.")
        )
      ),

      e("p", { className: "meta-line" },
        e("b", null, done + " of " + total), " characters ready"
      ),

      e("div", { className: "grid" },
        CHARACTERS.map(c => e(CharacterCard, {
          key: c.id, c, state: chars[c.id],
          onChange: (next) => setChar(c.id, next),
          onAI: (variantId) => goAI(c.id, variantId)
        }))
      ),

      e("div", { className: "foot" },
        e("div", { className: "foot-card" },
          e("div", { className: "prog" },
            e("div", { className: "ptext" }, allDone ? "All characters ready" : (done + " of " + total + " ready "), e("span", null, allDone ? "" : "\u2014 finish the rest to continue")),
            e("div", { className: "track" }, e("span", { style: { width: (done / total * 100) + "%" } }))
          ),
          e(Button, { size: "lg", disabled: !allDone, onClick: () => {
              if (!allDone) return;
              let draft = {};
              try { draft = JSON.parse(localStorage.getItem("bb_draft") || "{}"); } catch (e) {}
              let projects = [];
              try { projects = JSON.parse(localStorage.getItem("bb_projects") || "[]"); } catch (e) {}
              const id = "p" + Date.now();
              const grads = [
                "linear-gradient(165deg, #2b1769 0%, #6d28d9 42%, #7a1f4d 72%, #4a1717 100%)",
                "linear-gradient(180deg, #1d4ed8 0%, #0e7490 48%, #eab308 100%)",
                "linear-gradient(150deg, #052e2b 0%, #0f5132 55%, #14532d 80%, #052015 100%)",
                "linear-gradient(180deg, #0a0f24 0%, #1e1b4b 65%, #312e81 100%)"
              ];
              projects.unshift({
                id,
                title: draft.name || "Untitled storybook",
                meta: (draft.length || "32 pages") + " · " + (draft.style || "Storybook Illustration"),
                status: "Draft", statusClass: "draft",
                gradient: grads[Math.floor(Math.random() * grads.length)],
                progress: 8, bar: "#6366f1", time: "Just now"
              });
              try {
                localStorage.setItem("bb_projects", JSON.stringify(projects));
                localStorage.setItem("bb_current", id);
              } catch (e) {}
              location.href = "Workspace.html";
            } },
            "Create storybook", e(Icon, { name: "arrow-right", size: 16 })
          )
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
