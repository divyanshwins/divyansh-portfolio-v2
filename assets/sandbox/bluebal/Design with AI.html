  html, body { margin: 0; height: 100%; background: var(--background); color: var(--foreground);
    font-family: var(--font-sans, system-ui, sans-serif); }
  *, *::before, *::after { box-sizing: border-box; }
  #root { height: 100vh; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* top bar */
  .topbar {
    display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
    padding: 11px 18px; border-bottom: 1px solid var(--border); background: var(--card);
  }
  .iconbtn {
    width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--card); color: var(--foreground); cursor: pointer; display: grid; place-items: center;
    transition: background 120ms ease; flex: 0 0 auto;
  }
  .iconbtn:hover { background: var(--accent); }
  .tb-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .tb-spark { width: 30px; height: 30px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; flex: 0 0 auto; }
  .tb-t { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }
  .tb-s { font-size: 12px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
  .vchip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
    background: color-mix(in oklab, #7c3aed 13%, var(--card)); color: #6d28d9; display: inline-flex; align-items: center; gap: 4px; }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 9px; }

  .main { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) 440px; min-height: 0; }
  @media (max-width: 920px) { .main { grid-template-columns: 1fr; } .panel { display: none; } }

  /* chat column */
  .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--muted); }
  .stream { flex: 1 1 auto; overflow-y: auto; padding: 24px; }
  .stream-inner { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; gap: 11px; }
  .msg .av { width: 28px; height: 28px; border-radius: 7px; flex: 0 0 auto; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .av { background: var(--foreground); color: var(--background); }
  .msg.ai .av { background: var(--primary); color: var(--primary-foreground); }
  .bubble { font-size: 13.5px; line-height: 1.55; border-radius: var(--radius-lg); padding: 11px 14px; max-width: 80%; }
  .msg.ai .bubble { background: var(--card); border: 1px solid var(--border); }
  .msg.user .bubble { background: var(--primary); color: var(--primary-foreground); }
  .bubble p { margin: 0; }
  .bubble p + p { margin-top: 7px; }
  .bubble .applied {
    margin-top: 9px; display: flex; flex-direction: column; gap: 5px;
    border-top: 1px solid var(--border); padding-top: 9px;

  .bubble .applied .ai-item { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; color: var(--muted-foreground); }
  .bubble .applied .ai-item .ic { color: #16a34a; margin-top: 1px; flex: 0 0 auto; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-foreground); opacity: 0.5; animation: blink 1.2s infinite both; }

  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 0.9; transform: translateY(-2px); } }

  .composer { flex: 0 0 auto; padding: 14px 24px 18px; border-top: 1px solid var(--border); background: var(--muted); }
  .composer-inner { max-width: 680px; margin: 0 auto; }
  .suggest { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }

    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px 8px 8px 14px;

  .canvas .cap .cn { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .canvas .cap .cd { font-size: 11.5px; opacity: 0.85; margin-top: 2px; line-height: 1.4; }
  .canvas .vtag {
    position: absolute; top: 11px; right: 11px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;

  }
  .canvas .dl-btn {

  .canvas .dl-btn:hover { background: rgba(0,0,0,0.62); }

    position: absolute; top: 11px; left: 11px; font-size: 10.5px; font-weight: 600;

  .bubble-ctx .ic-book { color: #6d28d9; flex: 0 0 auto; }

      { id: "s_pack", cat: "Props",          text: "Always lugging a heavy pack of supplies",     ref: "p.8" },
      { id: "s_tooth",cat: "Distinguishing", text: "Calloused hands and a chipped front tooth",   ref: "p.11" },
      { id: "s_temp", cat: "Personality",    text: "Loud laugh, fiercely loyal, hot-headed",      ref: "p.3" }
    ],
    gita: [
      { id: "g_age",  cat: "Appearance",     text: "Late-50s, silver hair tied back",             ref: "p.7" },
      { id: "g_eyes", cat: "Appearance",     text: "Deep laugh-lines, steady grey eyes",          ref: "p.7" },
      { id: "g_robe", cat: "Wardrobe",       text: "Layered ochre robes with an embroidered hem", ref: "p.9" },
      { id: "g_staff",cat: "Props",          text: "A gnarled walking staff",                     ref: "p.10" },
      { id: "g_ink",  cat: "Distinguishing", text: "Ink-stained fingertips from old maps",        ref: "p.14" },
      { id: "g_temp", cat: "Personality",    text: "Patient and wry, speaks in riddles",          ref: "p.6" }
    ],
    sita: [
      { id: "t_frame",cat: "Appearance",     text: "Ageless presence, slight of frame",           ref: "p.1" },
      { id: "t_braid",cat: "Appearance",     text: "Long dark braid threaded with silver",        ref: "p.1" },
      { id: "t_shawl",cat: "Wardrobe",       text: "Midnight-blue shawl dotted with stars",       ref: "p.2" },
      { id: "t_journ",cat: "Props",          text: "Carries a small leather-bound journal",       ref: "p.5" },
      { id: "t_eyes", cat: "Distinguishing", text: "Eyes that seem to hold lantern-light",        ref: "p.8" },
      { id: "t_temp", cat: "Personality",    text: "Observant and gentle, a knowing tone",        ref: "p.3" }
    ]
  };

  function params() {
    const p = new URLSearchParams(location.search);
    return { char: p.get("char") || "ram", variant: p.get("variant") || null, ret: p.get("return") || null };
  }
  function loadChars() { try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; } }

  // seeded art background for a given hue + version
  function artStyle(hue, seed) {
    const h1 = (hue + seed * 14) % 360;
    const h2 = (hue + 40 + seed * 9) % 360;
    return {
      background:
        "radial-gradient(120% 90% at 30% 18%, hsl(" + h1 + " 70% 62%) 0%, transparent 55%)," +
        "radial-gradient(110% 80% at 78% 84%, hsl(" + h2 + " 65% 45%) 0%, transparent 58%)," +
        "linear-gradient(160deg, hsl(" + h1 + " 45% 22%), hsl(" + ((h2 + 300) % 360) + " 50% 14%))"
    };
  }
  function figureStyle(hue, seed) {
    const h = (hue + 20 + seed * 11) % 360;
    return { background: "linear-gradient(180deg, hsl(" + h + " 60% 70% / 0.55), hsl(" + ((h + 30) % 360) + " 55% 40% / 0.3))" };
  }

  // render the preview art to a real PNG and download it
  function downloadArt(hue, seed, meta, label) {
    const W = 1050, H = 1400;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    const h1 = (hue + seed * 14) % 360, h2 = (hue + 40 + seed * 9) % 360;
    const base = ctx.createLinearGradient(W * 0.15, 0, W * 0.85, H);
    base.addColorStop(0, "hsl(" + h1 + ", 45%, 22%)");
    base.addColorStop(1, "hsl(" + ((h2 + 300) % 360) + ", 50%, 14%)");
    ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);
    let r = ctx.createRadialGradient(W * 0.30, H * 0.18, 0, W * 0.30, H * 0.18, W * 0.95);
    r.addColorStop(0, "hsla(" + h1 + ", 70%, 62%, 1)"); r.addColorStop(0.55, "hsla(" + h1 + ", 70%, 62%, 0)");
    ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
    r = ctx.createRadialGradient(W * 0.78, H * 0.84, 0, W * 0.78, H * 0.84, W * 0.9);
    r.addColorStop(0, "hsla(" + h2 + ", 65%, 45%, 1)"); r.addColorStop(0.58, "hsla(" + h2 + ", 65%, 45%, 0)");
    ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
    const gh = (hue + seed * 14) % 360;
    let g = ctx.createRadialGradient(W * 0.32, H * 0.30, 0, W * 0.32, H * 0.30, W * 0.5);
    g.addColorStop(0, "hsla(" + gh + ", 80%, 65%, 0.7)"); g.addColorStop(1, "hsla(" + gh + ", 80%, 65%, 0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const fh = (hue + 20 + seed * 11) % 360;
    const fg = ctx.createLinearGradient(0, H * 0.24, 0, H * 0.88);
    fg.addColorStop(0, "hsla(" + fh + ", 60%, 70%, 0.55)"); fg.addColorStop(1, "hsla(" + ((fh + 30) % 360) + ", 55%, 40%, 0.3)");
    ctx.fillStyle = fg; ctx.beginPath();
    ctx.ellipse(W * 0.5, H * 0.56, W * 0.30, H * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.font = "700 " + Math.round(W * 0.34) + "px ui-monospace, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(meta.name[0], W * 0.5, H * 0.5);
    const sc = ctx.createLinearGradient(0, H * 0.58, 0, H);
    sc.addColorStop(0, "rgba(0,0,0,0)"); sc.addColorStop(1, "rgba(0,0,0,0.6)");
    ctx.fillStyle = sc; ctx.fillRect(0, H * 0.58, W, H * 0.42);
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.font = "700 " + Math.round(W * 0.05) + "px system-ui, sans-serif";
    ctx.fillText(meta.name, W * 0.045, H * 0.94);
    cv.toBlob(function (b) {
      const url = URL.createObjectURL(b);
      const a = document.createElement("a");
      a.href = url; a.download = meta.name + "-" + (label || "v1") + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }, "image/png");
  }

  // canned designer responses: ack + summary + applied bullet
  const RESPONSES = [
    { re: /(cloak|cape|robe|coat|outfit|cloth|wear|dress|costume)/i,
      ack: "Done. I redrew the wardrobe and kept the silhouette readable at small sizes.", item: "Updated the outfit" },
    { re: /(color|colour|palette|red|blue|green|gold|indigo|warm|cool|tone)/i,
      ack: "Adjusted the palette so it sits with the book's overall colors.", item: "Shifted the color palette" },
    { re: /(hair|eyes|face|skin|young|old|age|expression|smil|beard)/i,
      ack: "Reworked the facial features and expression while keeping the character recognisable.", item: "Refined facial features" },
    { re: /(light|lantern|glow|shadow|dusk|night|sun|mood|atmos)/i,
      ack: "Relit the scene \u2014 softer key light with warmer rim lighting.", item: "Reworked the lighting" },
    { re: /(prop|sword|staff|lantern|bag|hold|hand|weapon|accessor)/i,
      ack: "Added the prop and balanced it against the pose so the hands read clearly.", item: "Added a prop" },
    { re: /(evolv|older|grown|transform|variant|stronger|injur|scar|battle)/i,
      ack: "Pushed the design toward the later-story variant while keeping a clear through-line to the base look.", item: "Evolved the design for later pages" }
  ];
  function respondTo(text) {
    for (const r of RESPONSES) if (r.re.test(text)) return r;
    return { ack: "Got it \u2014 I worked that into the design and kept everything else consistent.", item: text.length > 46 ? text.slice(0, 44) + "\u2026" : text };
  }

  const SUGGESTIONS = [
    "Make the cloak a deep indigo",
    "Give them a warmer, friendlier face",
    "Add a glowing lantern in one hand",
    "Show them older and battle-worn"
  ];

  function uid() { return "m" + Math.random().toString(36).slice(2, 9); }

  function App() {
    const { char, variant, ret } = params();
    const backTo = ret === "workspace" ? "Workspace.html" : "Characters.html";
    const meta = CHAR_META[char] || CHAR_META.ram;
    const chars = loadChars();
    const charState = chars[char] || {};
    const variantObj = variant && (charState.variants || []).find(v => v.id === variant);
    const variantName = variantObj ? variantObj.name : null;
    const ranges = variantObj ? (variantObj.ranges || []) : null;
    const subjectLabel = variantName ? (meta.name + " \u00b7 " + variantName) : meta.name;

    // current design (so the studio opens on the existing character preview)
    const existing = variant ? (variantObj && variantObj.source) : charState.design;
    const existingImg = existing && existing.preview ? existing.preview : null;
    const hasExisting = !!existing;

    const styleSummary = (() => {
      try { const d = JSON.parse(localStorage.getItem("bb_draft") || "{}"); return d.style || "Storybook Illustration"; }
      catch (e) { return "Storybook Illustration"; }
    })();

    const [messages, setMessages] = useState(() => ([
      { id: uid(), role: "ai", text: hasExisting
        ? [
            "Here's " + subjectLabel + "'s current design \u2014 it's loaded in the preview on the right.",
            "Tell me what to change and I'll redraw it. I've also pulled the manuscript details for " + meta.name + " below in case you want to adjust the context."
          ]
        : [
            "Hi \u2014 let's design " + subjectLabel + ".",
            "I've read the whole manuscript and pulled out the details I found about " + meta.name + ". Pick which ones I should use as context below, then send your first prompt to start generating."
          ] }
    ]));
    const [applied, setApplied] = useState([]);     // [{text}]
    const [seed, setSeed] = useState(0);            // bumps the preview art
    const [versions, setVersions] = useState([{ seed: 0, label: "v1", img: existingImg }]);
    const [activeVer, setActiveVer] = useState(0);
    const [input, setInput] = useState("");
    const [busy, setBusy] = useState(false);
    const [panelOpen, setPanelOpen] = useState(true);

    const insightList = INSIGHTS[char] || INSIGHTS.ram;
    const [selected, setSelected] = useState(() => new Set(insightList.map(i => i.id)));
    const [insightsLocked, setInsightsLocked] = useState(false);  // true once first prompt sent
    const [insightsOpen, setInsightsOpen] = useState(false);      // collapsed-popover open
    const [lastSig, setLastSig] = useState("");                   // selection signature at last generation

    const streamRef = useRef(null);
    const taRef = useRef(null);

    useEffect(() => {
      if (streamRef.current) streamRef.current.scrollTop = streamRef.current.scrollHeight;
    }, [messages, busy]);

    const autosize = () => {
      const ta = taRef.current; if (!ta) return;
      ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
    };

    // group insights by category, preserving order
    const groups = (() => {
      const out = [];
      insightList.forEach(it => { let g = out.find(x => x.cat === it.cat); if (!g) { g = { cat: it.cat, items: [] }; out.push(g); } g.items.push(it); });
      return out;
    })();
    const total = insightList.length;
    const selCount = insightList.filter(it => selected.has(it.id)).length;
    const toggleIns = id => setSelected(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
    const selectAllIns = () => setSelected(new Set(insightList.map(i => i.id)));
    const clearIns = () => setSelected(new Set());

    const insightChips = () => groups.map((g, gi) => e("div", { className: "ins-group", key: gi },
      e("div", { className: "ins-cat" }, g.cat),
      e("div", { className: "ins-chips" }, g.items.map(it => e("button", {
        className: "ins-chip", key: it.id, type: "button", "data-on": selected.has(it.id), onClick: () => toggleIns(it.id)
      },
        e("span", { className: "ins-check" }, e(Icon, { name: "check", size: 11 })),
        e("span", { className: "ins-tx" }, it.text),
        it.ref && e("span", { className: "ins-ref" }, it.ref)
      )))
    ));
    const insightFoot = () => e("div", { className: "ins-foot" },
      e("span", { className: "ins-count" }, selCount + " of " + total + " selected"),
      e("div", { className: "ins-foot-actions" },
        e("button", { className: "ins-mini", type: "button", onClick: selectAllIns }, "Select all"),
        e("button", { className: "ins-mini", type: "button", onClick: clearIns }, "Clear")
      )
    );

    const send = (raw) => {
      const text = (raw != null ? raw : input).trim();
      if (!text || busy) return;
      const r = respondTo(text);

      // resolve manuscript context for this generation
      const sel = insightList.filter(it => selected.has(it.id));
      const sig = sel.map(it => it.id).sort().join(",");
      let ctxNote = null;
      if (!insightsLocked) {
        ctxNote = sel.length
          ? ("Using " + sel.length + " manuscript detail" + (sel.length === 1 ? "" : "s") + " as character context")
          : "Generating without manuscript context";
        setInsightsLocked(true); setInsightsOpen(false);
      } else if (sig !== lastSig) {
        ctxNote = sel.length
          ? ("Context updated \u2014 now using " + sel.length + " manuscript detail" + (sel.length === 1 ? "" : "s"))
          : "Context cleared \u2014 generating without manuscript details";
        setInsightsOpen(false);
      }
      setLastSig(sig);

      setMessages(m => [...m, { id: uid(), role: "user", text: [text] }]);
      setInput(""); setBusy(true);
      setTimeout(() => { if (taRef.current) taRef.current.style.height = "auto"; }, 0);

      // regenerate preview
      setTimeout(() => {
        setSeed(s => {
          const ns = s + 1;
          setVersions(vs => {
            const nv = [...vs, { seed: ns, label: "v" + (vs.length + 1) }];
            setActiveVer(nv.length - 1);
            return nv;
          });
          return ns;
        });
        setApplied(a => [...a, { text: r.item }]);
        setMessages(m => [...m, { id: uid(), role: "ai", text: [r.ack], applied: [r.item], ctx: ctxNote }]);
        setBusy(false);
      }, 1150);
    };

    const regenerate = () => {
      if (busy) return;
      setBusy(true);
      setTimeout(() => {
        setSeed(s => {
          const ns = s + 1;
          setVersions(vs => { const nv = [...vs, { seed: ns, label: "v" + (vs.length + 1) }]; setActiveVer(nv.length - 1); return nv; });
          return ns;
        });
        setMessages(m => [...m, { id: uid(), role: "ai", text: ["Here's another take with the same direction \u2014 slightly different lighting and composition."] }]);
        setBusy(false);
      }, 1150);
    };

    const useDesign = () => {
      const fresh = loadChars();
      if (!fresh[char]) fresh[char] = { mode: variant ? "variants" : "constant", design: null, variants: [] };
      const result = { type: "ai", versions: versions.length, changes: applied.map(a => a.text) };
      if (variant) {
        fresh[char].variants = (fresh[char].variants || []).map(v => v.id === variant ? { ...v, source: result } : v);
      } else {
        fresh[char].design = result;
      }
      try { localStorage.setItem(STORE, JSON.stringify(fresh)); } catch (e) {}
      location.href = backTo;
    };

    const shownSeed = versions[activeVer] ? versions[activeVer].seed : seed;
    const shownImg = versions[activeVer] ? versions[activeVer].img : null;

    // ---- preview canvas ----
    const canvas = e("div", { className: "canvas" },
      shownImg
        ? e("div", { className: "art", style: { background: "#000" } },
            e("img", { src: shownImg, alt: subjectLabel, style: { width: "100%", height: "100%", objectFit: "cover" } }))
        : e("div", { className: "art", style: artStyle(meta.hue, shownSeed) },
            e("div", { className: "glow", style: { left: "12%", top: "14%", width: "55%", height: "45%", background: "hsl(" + ((meta.hue + shownSeed * 14) % 360) + " 80% 65%)" } }),
            e("div", { className: "figure", style: figureStyle(meta.hue, shownSeed) }),
            e("div", { className: "initial" }, meta.name[0])
          ),
      e("div", { className: "scrim" }),
      e("div", { className: "pagetag" },
        e(Icon, { name: variant ? "book-open" : "user", size: 11 }),
        variant ? "Variant" : "Whole book"
      ),
      e("div", { className: "vtag" }, versions[activeVer] ? versions[activeVer].label : "v1"),
      e("div", { className: "cap" },
        e("div", { className: "cn" }, subjectLabel),
        e("div", { className: "cd" }, styleSummary + (ranges && ranges.length ? " \u00b7 pages " + ranges.map(r => r[0] === r[1] ? r[0] : r[0] + "\u2013" + r[1]).join(", ") : ""))
      ),
      e("button", { className: "dl-btn", title: "Download image", onClick: ev => { ev.stopPropagation(); if (shownImg) { const a = document.createElement("a"); a.href = shownImg; a.download = meta.name + ".png"; document.body.appendChild(a); a.click(); a.remove(); } else { downloadArt(meta.hue, shownSeed, meta, versions[activeVer] ? versions[activeVer].label : "v1"); } } },
        e(Icon, { name: "download", size: 15 })
      ),
      busy && e("div", { className: "gen" },
        e("div", { className: "sweep" }),
        e(Icon, { name: "loader", size: 26, className: "spin" }),
        e("div", { className: "gt" }, "Generating\u2026")
      )
    );

    return e("div", { className: "app" },
      // top bar
      e("div", { className: "topbar" },
        e("button", { className: "iconbtn", title: "Back", onClick: () => location.href = backTo },
          e(Icon, { name: "chevron-left", size: 18 })
        ),
        e("div", { className: "tb-title" },
          e("div", { className: "tb-spark" }, e(Icon, { name: "sparkles", size: 16 })),
          e("div", { style: { minWidth: 0 } },
            e("div", { className: "tb-t" }, "Design with AI"),
            e("div", { className: "tb-s" },
              meta.name,
              variantName ? e("span", { className: "vchip" }, e(Icon, { name: "layers", size: 10 }), variantName) : (" \u00b7 " + meta.role)
            )
          )
        ),
        e("div", { className: "tb-right" },
          e(Button, { variant: "outline", size: "icon", onClick: () => setPanelOpen(o => !o), title: panelOpen ? "Hide preview" : "Show preview" },
            e(Icon, { name: "panel-right", size: 15 })
          ),
          e(Button, { size: "sm", onClick: useDesign },
            e(Icon, { name: "check", size: 15 }), "Use this design"
          )
        )
      ),

      e("div", { className: "main", style: { gridTemplateColumns: panelOpen ? "minmax(0, 1fr) 360px" : "1fr" } },
        // chat
        e("div", { className: "chat" },
          e("div", { className: "stream", ref: streamRef },
            e("div", { className: "stream-inner" },
              messages.map(m => e("div", { className: "msg " + m.role, key: m.id },
                e("div", { className: "av" }, m.role === "ai" ? e(Icon, { name: "sparkles", size: 14 }) : "You"),
                e("div", { className: "bubble" },
                  m.ctx && e("div", { className: "bubble-ctx" }, e(Icon, { name: "book-open", size: 12, className: "ic-book" }), m.ctx),
                  m.text.map((p, i) => e("p", { key: i }, p)),
                  m.applied && e("div", { className: "applied" },
                    m.applied.map((it, i) => e("div", { className: "ai-item", key: i },
                      e("span", { className: "ic" }, e(Icon, { name: "check", size: 13 })), it))
                  )
                )
              )),
              !insightsLocked && e("div", { className: "insights-card", key: "insights" },
                e("div", { className: "ins-head" },
                  e("div", { className: "ins-ic" }, e(Icon, { name: "book-open", size: 16 })),
                  e("div", null,
                    e("div", { className: "ins-h" }, "Character details from the manuscript"),
                    e("div", { className: "ins-sub" }, "I scanned the whole manuscript for everything it says about " + meta.name + ". Keep the details you want me to use as context and deselect the rest \u2014 then send your first prompt.")
                  )
                ),
                insightChips(),
                insightFoot()
              ),
              busy && e("div", { className: "msg ai" },
                e("div", { className: "av" }, e(Icon, { name: "sparkles", size: 14 })),
                e("div", { className: "bubble" }, e("span", { className: "typing" }, e("i"), e("i"), e("i")))
              )
            )
          ),
          // composer
          e("div", { className: "composer" },
            e("div", { className: "composer-inner" },
              insightsLocked && e("div", { className: "ctx-bar" },
                e("button", { className: "ctx-pill", type: "button", "data-open": insightsOpen, onClick: () => setInsightsOpen(o => !o) },
                  e(Icon, { name: "book-open", size: 13, className: "ic-book" }),
                  "Manuscript context",
                  e("span", { className: "ctx-count" }, selCount),
                  e(Icon, { name: "chevron-up", size: 14, className: "ctx-caret" })
                ),
                insightsOpen && e("div", { className: "ctx-pop" },
                  e("div", { className: "ins-pop-h" }, "Character details from the manuscript"),
                  e("div", { className: "ins-pop-s" }, "Toggle the details I use as context. Changes apply on your next message."),
                  insightChips(),
                  insightFoot()
                )
              ),
              e("div", { className: "inputwrap" },
                e("textarea", {
                  ref: taRef, rows: 1, value: input, placeholder: "Describe a change to " + meta.name + "\u2026",
                  onChange: ev => { setInput(ev.target.value); autosize(); },
                  onKeyDown: ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(); } }
                }),
                e("button", { className: "sendbtn", disabled: !input.trim() || busy, onClick: () => send(), title: "Send" },
                  e(Icon, { name: "send", size: 16 })
                )
              ),
              e("div", { className: "hint" }, "Enter to send \u00b7 Shift+Enter for a new line")
            )
          )
        ),

        // preview panel
        panelOpen && e("div", { className: "panel" },
          e("div", { className: "panel-head" },
            e("div", null,
              e("div", { className: "ph-t" }, "Live preview"),
              e("div", { className: "ph-s" }, "Updates as you chat")
            ),
            e("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
              e("span", { className: "vchip", style: { background: "var(--muted)", color: "var(--muted-foreground)" } },
                versions.length + (versions.length === 1 ? " version" : " versions")),
              e("button", { className: "iconbtn", style: { width: 28, height: 28 }, title: "Collapse preview", onClick: () => setPanelOpen(false) },
                e(Icon, { name: "chevron-right", size: 16 }))
            )
          ),
          e("div", { className: "panel-body" },
            canvas,
            e("div", { className: "reg-row" },
              e(Button, { variant: "outline", size: "sm", onClick: regenerate, disabled: busy },
                e(Icon, { name: "rotate-ccw", size: 14 }), "Regenerate"),
              e(Button, { variant: "outline", size: "sm", onClick: () => alert("Upload a reference image to guide the AI") },
                e(Icon, { name: "image", size: 14 }), "Reference")
            ),

            e("div", { className: "sect-title" }, e(Icon, { name: "layers", size: 12 }), "Versions"),
            e("div", { className: "versions" },
              versions.map((v, i) => e("div", { className: "ver", key: i, "data-active": i === activeVer, onClick: () => setActiveVer(i) },
                v.img
                  ? e("div", { className: "vimg", style: { background: "#000", overflow: "hidden" } }, e("img", { src: v.img, alt: v.label, style: { width: "100%", height: "100%", objectFit: "cover" } }))
                  : e("div", { className: "vimg", style: artStyle(meta.hue, v.seed) }),
                e("div", { className: "vlb" }, v.label)
              ))
            ),

            e("div", { className: "sect-title" }, e(Icon, { name: "check", size: 12 }), "Changes applied"),
            applied.length === 0
              ? e("div", { className: "applied-empty" }, "Nothing yet. Send an instruction and each change you ask for will be logged here.")
              : e("div", { className: "applied-list" },
                  applied.map((a, i) => e("div", { className: "row", key: i },
                    e("span", { className: "ic" }, e(Icon, { name: "check", size: 11 })), a.text))
                )
          )
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
