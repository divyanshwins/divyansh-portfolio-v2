  html, body { margin:0; min-height:100%; background:var(--background); color:var(--foreground); font-family:var(--font-sans, system-ui, sans-serif); }

function toast(msg){
  let el = document.getElementById("__toast");
  if(!el){ el = document.createElement("div"); el.id="__toast"; el.className="toast-msg"; document.body.appendChild(el); }
  el.innerHTML = "";
  el.appendChild(Object.assign(document.createElement("span"),{textContent:msg}));
  el.classList.add("show");
  clearTimeout(el.__t); el.__t = setTimeout(()=>el.classList.remove("show"), 2200);
}
