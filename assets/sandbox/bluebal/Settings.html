<style>
  html, body { margin: 0; min-height: 100%; background: var(--background); color: var(--foreground); font-family: var(--font-sans, system-ui, sans-serif); }

  .navitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; color: var(--muted-foreground); cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; transition: background 120ms ease, color 120ms ease; }
  .navitem:hover { background: var(--accent); color: var(--foreground); }
  .navitem.active { background: var(--accent); color: var(--foreground); }
  .navitem svg { flex: none; opacity: 0.85; }

  .themecard.on .tc-radio { border-color: var(--primary); }
  .themecard.on .tc-radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

  .swatches { display: flex; gap: 10px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; display: grid; place-items: center; transition: transform 120ms ease; }
  .swatch:hover { transform: scale(1.08); }
  .swatch.on { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--foreground); }
  .swatch svg { color: #fff; }

  .integ { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--border); }
  .integ:last-child { border-bottom: none; }
  .integ-l { display: flex; align-items: center; gap: 14px; }
  .integ-ico { width: 40px; height: 40px; border-radius: var(--radius-md); display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; flex: none; }
  .integ-name { font-size: 14px; font-weight: 500; margin: 0 0 2px; }
  .integ-desc { font-size: 13px; color: var(--muted-foreground); margin: 0; }

  .storage-card { border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); padding: 22px; box-shadow: var(--shadow-sm); }
  .storage-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .storage-num { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .storage-num small { font-size: 14px; font-weight: 400; color: var(--muted-foreground); }
  .storage-cap { font-size: 13px; color: var(--muted-foreground); }
  .segbar { height: 10px; border-radius: 999px; background: var(--muted); overflow: hidden; display: flex; }
  .segbar > span { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted-foreground); }

  .about-list .row .lbl { font-weight: 500; }
  .about-ver { font-family: var(--font-mono, monospace); font-size: 13px; color: var(--muted-foreground); }

  .danger-card { border: 1px solid color-mix(in oklab, var(--destructive) 40%, var(--border)); border-radius: var(--radius-xl); background: color-mix(in oklab, var(--destructive) 5%, var(--card)); padding: 22px; }

  .kbd-table { width: 100%; border-collapse: collapse; }
  .kbd-table td { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .kbd-table tr:last-child td { border-bottom: none; }
  .kbd-table td.keys { text-align: right; }

  .saved-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--foreground); color: var(--background); font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity 200ms ease, transform 200ms ease; display: flex; align-items: center; gap: 8px; z-index: 60; }
  .saved-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

<script src="../_shared/vendor/react.production.min.js"></script>

<script>
const { Button, Switch, Select, Slider, Input, Badge, Dialog, DialogHeader, DialogTitle, DialogDescription, DialogFooter } = window.ShadcnUiDesignSystem_6211ba;
const Icon = window.Icon;
const e = React.createElement;

const STORE = "bb_settings_v1";
const DEFAULTS = {
  // General
  language: "English (US)", timezone: "(GMT-08:00) Pacific Time", dateFormat: "MMM D, YYYY", autoSave: true, startupPage: "Home Dashboard", defaultView: "Grid",
  // Projects
  sortOrder: "Recently Edited", projectStatus: "Draft", bookSize: "Square (8×8 in)", canvasSize: "1080 × 1080 px", versionHistory: true,
  // Collaboration
  sharingPerm: "Can View", allowInvites: true, commentPerm: "Everyone",
};

function loadSettings() {
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (_) { return Object.assign({}, DEFAULTS); }
}

const CATS = [
  { id: "general", label: "General", icon: "settings" },
  { id: "projects", label: "Projects", icon: "folder" },
  { id: "collaboration", label: "Collaboration", icon: "users" },
  { id: "about", label: "About", icon: "info" },
];

// ---- primitive rows ----
function Row({ label, desc, children, stacked }) {
  return e("div", { className: "row" + (stacked ? " stacked" : "") },
    e("div", { className: "row-info" },
      e("p", { className: "lbl" }, label),
      desc ? e("p", { className: "desc" }, desc) : null
    ),
    e("div", { className: "row-ctl" }, children)
  );
}

const sel = (value, onChange, options) => e(Select, { value: value, onChange: (ev) => onChange(ev.target.value), options: options });
const sw = (value, onChange) => e(Switch, { checked: value, onChange: (ev) => onChange(ev.target.checked) });

function Group({ title, children }) {
  return e("div", { className: "grp" }, title ? e("p", { className: "grp-title" }, title) : null, children);
}

// ---- category panels ----
function General({ s, set }) {
  return e(React.Fragment, null,
    e(Group, { title: "Localization" },
      e(Row, { label: "Language", desc: "The language used across menus, buttons, and dialogs." }, sel(s.language, v => set("language", v), ["English (US)", "English (UK)", "Español", "Français", "Deutsch", "日本語", "Português (BR)"])),
      e(Row, { label: "Time Zone", desc: "Timestamps on projects and activity use this zone." }, sel(s.timezone, v => set("timezone", v), ["(GMT-08:00) Pacific Time", "(GMT-05:00) Eastern Time", "(GMT+00:00) London", "(GMT+01:00) Berlin", "(GMT+05:30) India", "(GMT+09:00) Tokyo"])),
      e(Row, { label: "Date Format", desc: "How dates appear throughout the app." }, sel(s.dateFormat, v => set("dateFormat", v), ["MMM D, YYYY", "MM/DD/YYYY", "DD/MM/YYYY", "YYYY-MM-DD"]))
    ),
    e(Group, { title: "Behavior" },
      e(Row, { label: "Auto Save", desc: "Automatically save changes to your storybooks as you work." }, sw(s.autoSave, v => set("autoSave", v))),
      e(Row, { label: "Startup Page", desc: "The screen shown when you open BB artists." }, sel(s.startupPage, v => set("startupPage", v), ["Home Dashboard", "Last Opened Project", "New Project", "Templates"])),
      e(Row, { label: "Default Project View", desc: "How projects are laid out on the home dashboard." }, sel(s.defaultView, v => set("defaultView", v), ["Grid", "List", "Compact"]))
    )
  );
}

function Projects({ s, set }) {
  return e(React.Fragment, null,
    e(Group, { title: "Defaults" },
      e(Row, { label: "Default Sort Order", desc: "How projects are ordered on the dashboard." }, sel(s.sortOrder, v => set("sortOrder", v), ["Recently Edited", "Newest Created", "Alphabetical (A–Z)", "Most Pages", "Status"])),
      e(Row, { label: "Default Project Status", desc: "Status assigned to newly created storybooks." }, sel(s.projectStatus, v => set("projectStatus", v), ["Draft", "In Progress", "Complete"])),
      e(Row, { label: "Default Book Size", desc: "Trim size applied to new storybooks." }, sel(s.bookSize, v => set("bookSize", v), ["Square (8×8 in)", "Portrait (8×10 in)", "Landscape (10×8 in)", "A4 Portrait", "Custom"])),
      e(Row, { label: "Default Canvas Size", desc: "Pixel dimensions for new page canvases." }, sel(s.canvasSize, v => set("canvasSize", v), ["1080 × 1080 px", "1200 × 1500 px", "1500 × 1200 px", "2048 × 2048 px"]))
    ),
    e(Group, { title: "Lifecycle" },
      e(Row, { label: "Version History", desc: "Keep a timeline of saved versions for every project." }, sw(s.versionHistory, v => set("versionHistory", v)))
    )
  );
}

function Collaboration({ s, set }) {
  return e(React.Fragment, null,
    e(Group, { title: "Sharing" },
      e(Row, { label: "Default Sharing Permission", desc: "Access level granted when you share a new project." }, sel(s.sharingPerm, v => set("sharingPerm", v), ["Can View", "Can Comment", "Can Edit"])),
      e(Row, { label: "Allow Team Invitations", desc: "Let collaborators invite additional people to your projects." }, sw(s.allowInvites, v => set("allowInvites", v))),
      e(Row, { label: "Comment Permissions", desc: "Who is allowed to leave comments on your projects." }, sel(s.commentPerm, v => set("commentPerm", v), ["Everyone", "Collaborators only", "No one"]))
    )
  );
}

function About({ toast }) {
  return e(React.Fragment, null,
    e(Group, { title: "Application" },
      e("div", { className: "about-list" },
        e(Row, { label: "App Version", desc: "You are running the latest version." }, e("span", { className: "about-ver" }, "v3.8.2 (build 2481)")),
        e(Row, { label: "Release Notes", desc: "See what's new in this release." }, e(Button, { variant: "outline", onClick: () => toast("Opening release notes") }, "View notes")),
        e(Row, { label: "Privacy Policy", desc: "How we handle your data." }, e("a", { href: "#" }, "Read policy")),
        e(Row, { label: "Terms of Service", desc: "The terms you agree to by using BB artists." }, e("a", { href: "#" }, "Read terms"))
      )
    )
  );
}

function ResetPanel({ onReset }) {
  const [open, setOpen] = React.useState(false);
  return e("div", { className: "grp" },
    e("div", { className: "danger-card" },
      e("h3", null, "Reset All Settings to Default"),
      e("p", null, "This restores every preference across all categories to its original value. Your projects and account are not affected. This action cannot be undone."),
      e(Button, { variant: "destructive", onClick: () => setOpen(true) }, e(Icon, { name: "refresh-cw", size: 15 }), "Reset all settings"),
      open ? e(Dialog, { open: true, onOpenChange: (v) => { if (!v) setOpen(false); } },
        e(DialogHeader, null,
          e(DialogTitle, null, "Reset all settings?"),
          e(DialogDescription, null, "All preferences will return to their defaults. This can't be undone.")
        ),
        e(DialogFooter, null,
          e(Button, { variant: "outline", onClick: () => setOpen(false) }, "Cancel"),
          e(Button, { variant: "destructive", onClick: () => { onReset(); setOpen(false); } }, "Reset settings")
        )
      ) : null
    )
  );
}

const CAT_META = {
  general: { title: "General", sub: "Language, region, and default behavior for the app." },
  projects: { title: "Projects", sub: "Defaults and lifecycle rules for your storybooks." },
  collaboration: { title: "Collaboration", sub: "Sharing and permissions." },
  about: { title: "About", sub: "Version information and legal." },
};

function App() {
  const VALID = ["general", "projects", "collaboration", "about", "reset"];
  const [active, setActive] = React.useState(() => { const h = (location.hash || "").replace("#", ""); return VALID.indexOf(h) >= 0 ? h : "general"; });
  const [s, setS] = React.useState(loadSettings);
  const [toastMsg, setToastMsg] = React.useState("");
  const toastTimer = React.useRef(null);

  const toast = (msg) => {
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(""), 2200);
  };

  const set = (key, val) => {
    setS(prev => {
      const next = Object.assign({}, prev, { [key]: val });
      try { localStorage.setItem(STORE, JSON.stringify(next)); } catch (_) {}
      return next;
    });
    toast("Saved");
  };

  const reset = () => {
    setS(Object.assign({}, DEFAULTS));
    try { localStorage.setItem(STORE, JSON.stringify(DEFAULTS)); } catch (_) {}
    toast("All settings reset to default");
  };

  // Live-apply theme so the preview feels real
  React.useEffect(() => {
    const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const dark = s.theme === "dark" || (s.theme === "system" && sysDark);
    document.documentElement.classList.toggle("dark", dark);
  }, [s.theme]);

  const go = (id) => { setActive(id); history.replaceState(null, "", "#" + id); document.querySelector(".content").scrollTo && window.scrollTo(0, 0); };

  const meta = CAT_META[active] || {};
  let panel = null;
  if (active === "general") panel = e(General, { s, set });
  else if (active === "projects") panel = e(Projects, { s, set });
  else if (active === "collaboration") panel = e(Collaboration, { s, set });
  else if (active === "about") panel = e(About, { toast });

  return e(React.Fragment, null,
    e("header", { className: "topbar" },
      e("div", { className: "brand", onClick: () => { window.location.href = "Home.html"; } },
        e("span", { className: "mark" }, "BB"),
        e("span", null, "BB artists"),
        e("span", { className: "crumb" }, e("span", { className: "sep" }, "/"), "Settings")
      ),
      e("div", { className: "topbar-actions" },
        e(Button, { variant: "ghost", size: "icon", "aria-label": "Profile", onClick: () => { window.location.href = "Profile.html"; } }, e(Icon, { name: "user", size: 18 })),
        e(Button, { variant: "ghost", size: "icon", "aria-label": "Settings", "aria-current": "page" }, e(Icon, { name: "settings", size: 18 }))
      )
    ),
    e("div", { className: "shell" },
      e("aside", { className: "nav" },
        e("h2", null, "Settings"),
        e("p", { className: "navsub" }, "Manage how BB artists works"),
        e("nav", { className: "navlist" },
          CATS.map(c => e("button", { key: c.id, className: "navitem" + (active === c.id ? " active" : ""), onClick: () => go(c.id) },
            e(Icon, { name: c.icon, size: 17 }), c.label
          )),
          e("div", { className: "navsep" }),
          e("button", { className: "navitem danger" + (active === "reset" ? " active" : ""), onClick: () => go("reset") },
            e(Icon, { name: "refresh-cw", size: 17 }), "Reset"
          )
        )
      ),
      e("main", { className: "content" },
        active === "reset"
          ? e(React.Fragment, null,
              e("div", { className: "cat-head" }, e("h1", null, "Reset"), e("p", null, "Restore preferences to their defaults.")),
              e("div", { className: "cat-rule" }),
              e(ResetPanel, { onReset: reset })
            )
          : e(React.Fragment, null,
              e("div", { className: "cat-head" }, e("h1", null, meta.title), e("p", null, meta.sub)),
              e("div", { className: "cat-rule" }),
              panel
            )
      )
    ),
    e("div", { className: "saved-toast" + (toastMsg ? " show" : "") }, e(Icon, { name: "check", size: 15 }), toastMsg)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
