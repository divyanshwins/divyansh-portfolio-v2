  }

        e("div", { className: "grow" }, e(Input, { type: "email", placeholder: "Email address", value: email, onChange: (ev) => setEmail(ev.target.value), onKeyDown: (ev) => { if (ev.key === "Enter") invite(); } })),
        PermSelect(perm, (ev) => setPerm(ev.target.value)),
        e(Button, { onClick: invite }, "Invite")
      ),
      e("div", { className: "dlg-sep" }),
      e("div", { className: "dlg-label" }, "People with access"),
      e("div", { className: "collab-list" },
        people.map((m, i) => e("div", { key: i, className: "collab-item" },
          e("span", { className: "av", style: { background: m.color } }, m.initials),
          e("div", { style: { flex: 1 } }, e("div", { className: "nm" }, m.name), e("div", { className: "rl" }, m.role))
        ))
      ),
      e("div", { className: "dlg-sep" }),
      e("div", { className: "dlg-label" }, "Share link"),
      e("div", { className: "dlg-row" },
        e("div", { className: "grow" }, e(Input, { readOnly: true, value: link })),
        PermSelect(linkPerm, (ev) => setLinkPerm(ev.target.value)),
        e(Button, { variant: "outline", onClick: copy }, copied ? e(Icon, { name: "check", size: 16 }) : glyph(G.link), copied ? "Copied" : "Copy link")
      ),
      e(DialogFooter, null,
        e(Button, { variant: "outline", onClick: onClose }, "Done")
      )
    );
  }

  function CollabDialog({ project, onClose, onManage }) {
    const people = Roster({ project: project });
    return e(Dialog, { open: true, onOpenChange: (v) => { if (!v) onClose(); } },
      e(DialogHeader, null,
        e(DialogTitle, null, "Collaborators"),
        e(DialogDescription, null, people.length + (people.length === 1 ? " person" : " people") + " on “" + project.title + "”")
      ),
      e("div", { className: "collab-list" },
        people.map((m, i) => e("div", { key: i, className: "collab-item" },
          e("span", { className: "av", style: { background: m.color } }, m.initials),
          e("div", { style: { flex: 1 } }, e("div", { className: "nm" }, m.name), e("div", { className: "rl" }, m.role))
        ))
      ),
      e(DialogFooter, null,
        e(Button, { variant: "outline", onClick: onClose }, "Close"),
        e(Button, { onClick: onManage }, glyph(G.userPlus), "Add team member")
      )
    );
  }

  function Home() {
    const [query, setQuery] = React.useState("");
    const [sortKey, setSortKey] = React.useState("edited-desc");
    const [shareProj, setShareProj] = React.useState(null);
    const [collabProj, setCollabProj] = React.useState(null);
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem("bb_projects") || "[]"); } catch (e) {}
    const openWs = (id) => { try { localStorage.setItem("bb_current", id); } catch (e) {} window.location.href = "Workspace.html"; };
    const savedCards = saved.map(p => Object.assign(normalize(p), { onClick: () => openWs(p.id) }));
    const ALL = savedCards.concat(PROJECTS.map(normalize));
    const inProgress = ALL.filter(p => p.status === "In Progress").length;
    const countText = ALL.length + (ALL.length === 1 ? " project" : " projects") + " · " + inProgress + " in progress";

    const onShare = (p) => setShareProj(p);
    const onCollab = (p) => setCollabProj(p);
    const onMenu = (p, action) => {
      if (action === "edit") { (p.onClick || (() => { window.location.href = "Workspace.html"; }))(); return; }
      if (action === "rename") { window.prompt("Rename project", p.title); return; }
      if (action === "duplicate") { window.alert("“" + p.title + "” duplicated."); return; }
      if (action === "delete") { window.confirm("Delete “" + p.title + "”? This can’t be undone."); return; }
    };

    const q = query.trim().toLowerCase();
    const filtered = q ? ALL.filter(p => {
      const hay = [p.title, p.bookType, p.author, (p.tags || []).join(" ")].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    }) : ALL;
    const visible = sortProjects(filtered, sortKey);

    const sortItems = SORT_OPTIONS.map(opt => ({
      label: opt.label,
      icon: e("span", { className: "menu-check" }, sortKey === opt.key ? e(Icon, { name: "check", size: 16 }) : null),
      onSelect: () => setSortKey(opt.key)
    }));

    const sortGlyph = e("span", { className: "sort-ico" },
      e("svg", { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
        e("path", { d: "m3 16 4 4 4-4" }), e("path", { d: "M7 20V4" }),
        e("path", { d: "m21 8-4-4-4 4" }), e("path", { d: "M17 4v16" })
      )
    );

    return e(React.Fragment, null,
      e("header", { className: "topbar" },
        e("div", { className: "brand" },
          e("span", { className: "mark" }, "BB"),
          "BB artists"
        ),
        e("div", { className: "topbar-actions" },
          e(Button, { variant: "ghost", size: "icon", "aria-label": "Profile", onClick: () => { window.location.href = "Profile.html"; } },
            e(Icon, { name: "user", size: 18 })
          ),
          e(Button, { variant: "ghost", size: "icon", "aria-label": "Settings", onClick: () => { window.location.href = "Settings.html"; } },
            e(Icon, { name: "settings", size: 18 })
          )
        )
      ),
      e("main", { className: "container" },
        e("div", { className: "section-head" },
          e("div", null,
            e("h1", null, "Your Projects"),
            e("p", { className: "sub" }, countText)
          ),
          e(Button, { onClick: () => { window.location.href = "New Project.html"; } },
            e(Icon, { name: "plus", size: 16 }),
            "New Project"
          )
        ),
        e("div", { className: "rule" }),
        e("div", { className: "toolbar" },
          e("div", { className: "search-wrap" },
            e(InputGroup, {
              prefix: e(Icon, { name: "search", size: 16 }),
              placeholder: "Search projects...",
              "aria-label": "Search projects",
              value: query,
              onChange: (ev) => setQuery(ev.target.value)
            })
          ),
          e("div", { className: "sort-wrap" },
            e(DropdownMenu, {
              align: "end",
              trigger: e(Button, { variant: "outline" }, sortGlyph, "Sort"),
              items: sortItems
            })
          )
        ),
        visible.length === 0
          ? e("div", { className: "empty" },
              e("div", { className: "ic" }, e(Icon, { name: "search", size: 20 })),
              e("p", null, "No projects found. Try another search.")
            )
          : e("div", { className: "grid" },
              visible.map((p, i) => e(React.Fragment, { key: p.id || i }, ProjectCard(Object.assign({}, p, { onShare: onShare, onCollab: onCollab, onMenu: onMenu })))),
              !q ? e("div", { className: "newcard", onClick: () => { window.location.href = "New Project.html"; } },
                e("div", { className: "plus" }, e(Icon, { name: "plus", size: 22 })),
                e("span", null, "Create new storybook")
              ) : null
            )
      ),
      shareProj ? e(ShareDialog, { key: "share", project: shareProj, onClose: () => setShareProj(null) }) : null,
      collabProj ? e(CollabDialog, { key: "collab", project: collabProj, onClose: () => setCollabProj(null), onManage: () => { setShareProj(collabProj); setCollabProj(null); } }) : null
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Home));
</script>
</body>
</html>
